<style>

.card{background:var(--surf);border:.5px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px;}

.forfait-item{display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--surf2);border-radius:var(--rsm);margin-bottom:4px;font-size:12px;flex-wrap:wrap;}
.forfait-item input[type=date]{width:125px;background:var(--surf);border:.5px solid var(--border2);border-radius:4px;padding:3px 5px;font-size:11px;color:var(--text);font-family:inherit;outline:none;}
.forfait-item input[type=number]{width:65px;background:var(--surf);border:.5px solid var(--border2);border-radius:4px;padding:3px 5px;font-size:12px;color:var(--text);font-family:inherit;outline:none;}
.ybtn{padding:5px 13px;border-radius:20px;border:.5px solid var(--border2);background:none;color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit;}
.ybtn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.sec-title{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin:1.25rem 0 .75rem;padding-bottom:6px;border-bottom:.5px solid var(--border2);}
.loc-color{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:1px;}
.spin{display:inline-block;width:11px;height:11px;border:2px solid rgba(128,128,128,.25);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:4px;}
@keyframes sp{to{transform:rotate(360deg);}}
@media(max-width:520px){
  .sgrid{grid-template-columns:1fr 1fr;}
  .bgrid{grid-template-columns:1fr 1fr;}
  .tab{font-size:11px;padding:7px 3px;}

}

<script>
// ════════════════════════════════════════════════════════════
//  JSONBIN
// ════════════════════════════════════════════════════════════
const BIN_ID  = "69ff6396c0954111d8fcb091";
const API_KEY = "$2a$10$w8q1L/f0pDxQRu8gWdicXerF2USsSati1MdCZZTo26ieSTBsCfnmy";
const BIN_URL = "https://api.jsonbin.io/v3/b/"+BIN_ID;
const HDRS    = {"Content-Type":"application/json","X-Master-Key":API_KEY,"X-Bin-Versioning":"false"};
const CACHE   = "jeancamp_v7";

const MOIS = ["Jan","Fév","Mar","Avr","Mai","Jun","Jul","Aoû","Sep","Oct","Nov","Déc"];
const COLORS = ["#1a6fc4","#0f7a5a","#c44a1a","#5a45b8","#0a8080","#b06010","#7a2080","#206040"];

// ════════════════════════════════════════════════════════════
//  STRUCTURE : une liste unique de locataires
//  Chaque locataire a :
//    id, nom, appart, couleur
//    elec: { actif:bool, forfaits:[{debut,fin,montant}] }
//    eau:  { actif:bool, forfaits:[{debut,fin,montant}] }
//  Relevés séparés :
//    state.elec.releves : [{date, [locId]: kwh, ...}]
//    state.eau.releves  : [{date, [locId]: m3, ...}]
// ════════════════════════════════════════════════════════════

const DEFAULTS = {
  tarifElec: 0.19,
  tarifEau:  3.50,
  locataires: [
    {id:"l1", nom:"Nicole Vidal",  appart:"Appart Bas Pizzeria", couleur:"#1a6fc4",
     elec:{actif:true,  forfaits:[{debut:"01/01/2025",fin:null,montant:50}]},
     eau: {actif:true,  forfaits:[{debut:"01/01/2025",fin:null,montant:20}]}},
    {id:"l2", nom:"Ana",           appart:"Appart Bas Jardin",   couleur:"#0f7a5a",
     elec:{actif:true,  forfaits:[{debut:"01/01/2025",fin:null,montant:75}]},
     eau: {actif:true,  forfaits:[{debut:"01/01/2025",fin:null,montant:20}]}},
    {id:"l3", nom:"Thomas/Sandy",  appart:"Appart Étage",        couleur:"#c44a1a",
     elec:{actif:true,  forfaits:[{debut:"01/01/2025",fin:null,montant:100}]},
     eau: {actif:true,  forfaits:[{debut:"01/01/2025",fin:null,montant:30}]}},
    {id:"l4", nom:"Emma",          appart:"Bureau",              couleur:"#5a45b8",
     elec:{actif:true,  forfaits:[{debut:"01/01/2025",fin:null,montant:0}]},
     eau: {actif:false, forfaits:[{debut:"01/01/2025",fin:null,montant:0}]}},
  ],
  elec: {
    releves:[
      {date:"01/03/2025",l1:4497.5, l2:6527.47, l3:8378.97,  l4:1102.6},
      {date:"01/04/2025",l1:4929.53,l2:7210.91, l3:9154.91,  l4:1118.53},
      {date:"01/05/2025",l1:5234.65,l2:7701.43, l3:9900.0,   l4:1129.0},
      {date:"01/06/2025",l1:5511.36,l2:8311.04, l3:10349.03, l4:1141.11},
      {date:"01/07/2025",l1:5686.71,l2:8589.22, l3:10609.55, l4:1146.85},
      {date:"01/08/2025",l1:5848.46,l2:8907.1,  l3:10844.48, l4:1150.92},
      {date:"01/09/2025",l1:6031.12,l2:9291.89, l3:11628.25, l4:1276.94},
      {date:"01/10/2025",l1:6304.01,l2:9697.58, l3:12346.55, l4:1410.87},
      {date:"01/11/2025",l1:6475.94,l2:9919.4,  l3:12714.47, l4:1440.04},
      {date:"01/12/2025",l1:6627.34,l2:10120.72,l3:12913.22, l4:1473.98},
      {date:"01/01/2026",l1:6806.87,l2:10345.19,l3:13276.33, l4:1504.2},
      {date:"01/02/2026",l1:7174.31,l2:10818.17,l3:14293.58, l4:1542.88},
      {date:"01/03/2026",l1:7851.35,l2:11767.6, l3:15920.24, l4:1591.83},
      {date:"01/04/2026",l1:8219.76,l2:12273.85,l3:16501.95, l4:1618.22},
      {date:"01/05/2026",l1:8525.89,l2:12769.62,l3:16914.85, l4:1635.16},
    ]
  },
  eau: { releves:[] }
};

// ════════════════════════════════════════════════════════════
//  ÉTAT
// ════════════════════════════════════════════════════════════
let STATE = null;
const S  = ()=>STATE;
const LE = ()=>STATE.locataires.filter(l=>l.elec&&l.elec.actif);
const LW = ()=>STATE.locataires.filter(l=>l.eau&&l.eau.actif);

function setState(data){
  STATE = configFactures(configCompteurGeneral(migrer(data)));
  localStorage.setItem(CACHE, JSON.stringify(STATE));
}

function migrer(data){
  // Déjà au nouveau format
  if(data.locataires && Array.isArray(data.locataires) && data.locataires[0] && data.locataires[0].elec){
    if(!data.elec) data.elec = {releves:[]};
    if(!data.eau)  data.eau  = {releves:[]};
    return data;
  }
  // Ancien format → nouveau
  const n = JSON.parse(JSON.stringify(DEFAULTS));
  // Relevés élec anciens (clés pizzeria/jardin/etage/bureau → l1/l2/l3/l4)
  const map = {pizzeria:"l1",jardin:"l2",etage:"l3",bureau:"l4"};
  if(data.elec && data.elec.releves){
    n.elec.releves = data.elec.releves.map(r=>{
      const nr={date:r.date};
      Object.keys(map).forEach(k=>{ if(r[k]!=null) nr[map[k]]=r[k]; });
      return nr;
    });
  } else if(data.releves){
    n.elec.releves = data.releves.map(r=>{
      const nr={date:r.date};
      Object.keys(map).forEach(k=>{ if(r[k]!=null) nr[map[k]]=r[k]; });
      return nr;
    });
  }
  // Tarifs
  if(data.tarifElec) n.tarifElec=data.tarifElec;
  else if(data.elec&&data.elec.tarif) n.tarifElec=data.elec.tarif;
  if(data.tarifEau) n.tarifEau=data.tarifEau;
  else if(data.eau&&data.eau.tarifM3) n.tarifEau=data.eau.tarifM3;
  // Relevés eau anciens
  if(data.eau&&data.eau.releves) n.eau.releves=data.eau.releves;
  // Locataires eau anciens
  if(data.eau&&data.eau.locataires){
    data.eau.locataires.forEach((wl,i)=>{
      if(i<n.locataires.length){
        n.locataires[i].eau.actif=true;
        const forf=wl.forfaits||[{debut:"01/01/2025",fin:null,montant:wl.forfait||0}];
        n.locataires[i].eau.forfaits=forf;
      }
    });
    // Remapper IDs eau anciens (w-pizzeria etc) vers l1/l2/l3/l4
    const wmap={"w-pizzeria":"l1","w-jardin":"l2","w-etage":"l3","w-bureau":"l4"};
    n.eau.releves=n.eau.releves.map(r=>{
      const nr={date:r.date};
      Object.keys(wmap).forEach(k=>{ if(r[k]!=null) nr[wmap[k]]=r[k]; });
      // garder les IDs non mappés
      Object.keys(r).forEach(k=>{ if(k!=='date'&&!wmap[k]) nr[k]=r[k]; });
      return nr;
    });
  }
  return n;
}

// Compteur d'eau général : le compteur relevé pour la pizzeria compte aussi
// l'eau des appartements. loc.eau.deduire = [ids] → conso réelle = général − ces appartements.
// Si rien n'est encore réglé, on détecte la pizzeria et on déduit les autres compteurs eau.
function configCompteurGeneral(st){
  if(!st||!st.locataires) return st;
  const dejaRegle=st.locataires.some(l=>l.eau&&Array.isArray(l.eau.deduire));
  if(dejaRegle) return st;
  const estPizz=l=>/pizz/i.test(l.nom)||(/pizz/i.test(l.appart)&&!/appart/i.test(l.appart));
  const cands=st.locataires.filter(l=>l.eau&&l.eau.actif&&estPizz(l));
  if(cands.length===1){
    const g=cands[0];
    g.eau.deduire=st.locataires.filter(l=>l.id!==g.id&&l.eau&&l.eau.actif).map(l=>l.id);
  }
  return st;
}
// Factures de charges (sociétés) : émetteur SCI + fiches clients pré-remplies
const EMETTEUR_DEFAUT={nom:"SCI Thomarion",adr1:"83 avenue Jean Camp",adr2:"11100 Narbonne",
  siret:"918 029 810 00010",tva:"FR64918029810",tel:"06 63 09 74 82",email:"tmjumeaux@orange.fr",tauxTva:20,tarifsTTC:true};
const CLIENTS_CONNUS=[
  {re:/initiales/i, f:{raison:"SAS Les 4 Initiales",adr1:"83 avenue Jean Camp",adr2:"11100 Narbonne",siren:"SIREN 108 463 563",tva:"FR30108463563"}},
  {re:/fascian/i,   f:{raison:"SASU Pizzeria Fascianella",adr1:"83 avenue Jean Camp",adr2:"11100 Narbonne",siren:"SIRET 939 245 981 00013",tva:"FR87939245981"}},
];
function configFactures(st){
  if(!st||!st.locataires) return st;
  if(!st.emetteur) st.emetteur={...EMETTEUR_DEFAUT};
  if(!Array.isArray(st.facturesCharges)) st.facturesCharges=[];
  st.locataires.forEach(l=>{
    if(l.facture) return;
    const c=CLIENTS_CONNUS.find(c=>c.re.test(l.nom)||c.re.test(l.appart));
    if(c) l.facture={actif:true,...c.f};
  });
  return st;
}
// Tarifs par locataire (vide = tarif global) + abonnement électricité mensuel
const TE=loc=>(loc&&loc.elec&&+loc.elec.tarif>0)?+loc.elec.tarif:S().tarifElec;
const TW=loc=>(loc&&loc.eau&&+loc.eau.tarif>0)?+loc.eau.tarif:S().tarifEau;
const ABO=loc=>(loc&&loc.elec&&+loc.elec.abo>0)?+loc.elec.abo:0;
const aFacture=loc=>!!(loc&&loc.facture&&loc.facture.actif);
const estGeneral=loc=>!!(loc&&loc.eau&&Array.isArray(loc.eau.deduire)&&loc.eau.deduire.length);

// ════════════════════════════════════════════════════════════
//  SYNC
// ════════════════════════════════════════════════════════════
const syncEl=document.getElementById("sync");
const setSyncOk  =()=>{ syncEl.className="sync ok";  syncEl.textContent="✅ Synchronisé"; };
const setSyncErr =()=>{ syncEl.className="sync err"; syncEl.textContent="❌ Hors ligne"; };
const setSyncBusy=(m)=>{ syncEl.className="sync busy"; syncEl.innerHTML=`<span class="spin"></span>${m||"Sauvegarde…"}`; };

async function charger(){
  setSyncBusy("Chargement…");
  try{
    const r=await fetch(BIN_URL+"/latest",{headers:{"X-Master-Key":API_KEY}});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const data=await r.json();
    const rec=data.record;
    if(!rec||rec.init){ await sauvegarder(); }
    else{ setState(rec); setSyncOk(); refreshCurrent(); }
  }catch(e){ console.error(e); setSyncErr(); }
}

async function sauvegarder(data){
  if(data) setState(data);
  setSyncBusy();
  try{
    const r=await fetch(BIN_URL,{method:"PUT",headers:HDRS,body:JSON.stringify(STATE)});
    if(!r.ok) throw new Error("HTTP "+r.status);
    localStorage.setItem(CACHE,JSON.stringify(STATE));
    setSyncOk();
  }catch(e){ setSyncErr(); alert("Erreur sauvegarde : "+e.message); }

function parseD(s){ const[d,m,y]=s.split("/"); return new Date(+y,+m-1,+d); }
function getYear(s){ return s.split("/")[2]; }
function getYearsFrom(releves){ return[...new Set(releves.map(r=>getYear(r.date)))].sort(); }
function sortByDate(a,b){ return parseD(a.date)-parseD(b.date); }
function fmtBal(b){ return(b>=0?"+":"")+b.toFixed(2); }
function colorBal(b){ return b>=0?"var(--ok)":"var(--err)"; }
function toInputDate(s){ if(!s) return ""; const[d,m,y]=s.split("/"); return`${y}-${m}-${d}`; }
function fromInputDate(s){ if(!s) return null; const[y,m,d]=s.split("-"); return`${d}/${m}/${y}`; }
function dateLabel(s){
  const[d,m,y]=s.split("/");
  return`${MOIS[+m-1]} ${y}<br><span style="font-size:10px;color:var(--text3)">le ${d}/${m}</span>`;
}
function getForfait(forfaits,dateStr){
  const d=parseD(dateStr);
  const matches=forfaits.filter(f=>{
    const debut=parseD(f.debut);
    const fin=f.fin?parseD(f.fin):new Date(9999,0,1);
    return d>=debut&&d<=fin;
  }).sort((a,b)=>parseD(b.debut)-parseD(a.debut));
  return matches.length?matches[0].montant:0;
}
function badgeKwh(d){ return d>400?"berr":d>200?"bwarn":"bok"; }
function badgeM3(d){  return d>10?"berr":d>5?"bwarn":"bok"; }

// Calcul diffs élec pour un locataire
function calcElecDiffs(locId){
  const rels=[...S().elec.releves.filter(r=>r[locId]!=null)].sort(sortByDate);
  const loc=S().locataires.find(l=>l.id===locId);
  if(!loc) return [];
  const res=[];
  for(let i=1;i<rels.length;i++){
    const diff=+(rels[i][locId]-rels[i-1][locId]).toFixed(2);
    const prix=+(diff*TE(loc)+ABO(loc)).toFixed(2);
    const forf=getForfait(loc.elec.forfaits,rels[i].date);
    const photos=rels[i].photos||[];
    res.push({date:rels[i].date,releve:rels[i][locId],diff,prix,forf,photos});
  }
  return res;
}

// Calcul diffs eau pour un locataire
function calcEauDiffs(locId){
  const rels=[...S().eau.releves.filter(r=>r[locId]!=null)].sort(sortByDate);
  const loc=S().locataires.find(l=>l.id===locId);
  if(!loc) return [];
  const res=[];
  const general=estGeneral(loc);
  for(let i=1;i<rels.length;i++){
    const brut=+(rels[i][locId]-rels[i-1][locId]).toFixed(3);
    let diff=brut, deduit=0;
    const manquants=[];
    if(general){
      loc.eau.deduire.forEach(id=>{
        const a=S().locataires.find(l=>l.id===id); if(!a) return;
        const v1=rels[i-1][id], v2=rels[i][id];
        if(v1==null||v2==null){ manquants.push(a.nom); return; }
        deduit+=v2-v1;
      });
      deduit=+deduit.toFixed(3);
      diff=+(brut-deduit).toFixed(3);
    }
    const prix=+(diff*TW(loc)).toFixed(2);
    const forf=getForfait(loc.eau.forfaits,rels[i].date);
    const photos=rels[i].photos||[];
    res.push({date:rels[i].date,releve:rels[i][locId],diff,prix,forf,photos,general,brut,deduit,manquants});
  }
  return res;
}

function elecDernier(locId){
  const rels=[...S().elec.releves.filter(r=>r[locId]!=null)].sort(sortByDate);
  return rels.length?rels[rels.length-1][locId]:null;
}
function eauDernier(locId){
  const rels=[...S().eau.releves.filter(r=>r[locId]!=null)].sort(sortByDate);
  return rels.length?rels[rels.length-1][locId]:null;
}

function renderForfaits(forfaits,type,locId){
  return forfaits.map((f,i)=>`
    <div class="forfait-item">
      <span style="font-size:11px;color:var(--text2)">Du</span>
      <input type="date" value="${toInputDate(f.debut)}" onchange="updForfait('${type}','${locId}',${i},'debut',this.value)"/>
      <span style="font-size:11px;color:var(--text2)">au</span>
      <input type="date" value="${toInputDate(f.fin||'')}" placeholder="en cours" onchange="updForfait('${type}','${locId}',${i},'fin',this.value)"/>
      <span style="font-size:11px;color:var(--text2)">=</span>
      <input type="number" value="${f.montant}" min="0" step="5" onchange="updForfait('${type}','${locId}',${i},'montant',this.value)"/>
      <span style="font-size:11px;color:var(--text2)">€/mois</span>
      ${forfaits.length>1?`<button class="btn-del" onclick="delForfait('${type}','${locId}',${i})">✕</button>`:''}
    </div>`).join('');
}

window.updForfait=function(type,locId,idx,field,val){
  const loc=S().locataires.find(l=>l.id===locId);
  if(!loc) return;
  const f=loc[type].forfaits[idx];
  if(field==='debut') f.debut=fromInputDate(val)||f.debut;
  else if(field==='fin') f.fin=fromInputDate(val);
  else f.montant=parseFloat(val)||0;
};

window.addForfait=function(type,locId){
  const loc=S().locataires.find(l=>l.id===locId);
  if(!loc) return;
  const last=loc[type].forfaits[loc[type].forfaits.length-1];
  loc[type].forfaits.push({debut:"01/01/2026",fin:null,montant:last.montant});
  document.getElementById(`forf-${type}-${locId}`).innerHTML=renderForfaits(loc[type].forfaits,type,locId);
};

window.delForfait=function(type,locId,idx){
  const loc=S().locataires.find(l=>l.id===locId);
  if(!loc) return;
  loc[type].forfaits.splice(idx,1);
  document.getElementById(`forf-${type}-${locId}`).innerHTML=renderForfaits(loc[type].forfaits,type,locId);
};

};

    const n=document.getElementById("loc-nom-"+loc.id);
    const a=document.getElementById("loc-appart-"+loc.id);
    if(n) loc.nom=n.value;
    if(a) loc.appart=a.value;
    const ce=document.getElementById("loc-elec-actif-"+loc.id);
    const cw=document.getElementById("loc-eau-actif-"+loc.id);
    if(ce) loc.elec.actif=ce.checked;
    if(cw) loc.eau.actif=cw.checked;
    const num=id=>{const el=document.getElementById(id); if(!el) return undefined; const v=parseFloat(el.value); return isNaN(v)||v<=0?null:v;};
    const te=num("loc-tarif-elec-"+loc.id), ab=num("loc-abo-elec-"+loc.id), tw=num("loc-tarif-eau-"+loc.id);
    if(te!==undefined){ if(te) loc.elec.tarif=te; else delete loc.elec.tarif; }
    if(ab!==undefined){ if(ab) loc.elec.abo=ab; else delete loc.elec.abo; }
    if(tw!==undefined){ if(tw) loc.eau.tarif=tw; else delete loc.eau.tarif; }
    if(loc.facture&&document.getElementById("fc-raison-"+loc.id)){
      ["raison","siren","adr1","adr2","tva"].forEach(k=>{ const el=document.getElementById(`fc-${k}-${loc.id}`); if(el) loc.facture[k]=el.value.trim(); });
    }
  });
  const E=S().emetteur;
  ["nom","adr1","adr2","siret","tva","tel","email"].forEach(k=>{ const el=document.getElementById("em-"+k); if(el) E[k]=el.value.trim(); });
  const ed=document.getElementById("em-dossier"); if(ed&&ed.value.trim()) E.dossierTVA=ed.value.trim();
  const tx=parseFloat((document.getElementById("em-taux")||{}).value); if(!isNaN(tx)&&tx>=0) E.tauxTva=tx;
  const tt=document.getElementById("em-ttc"); if(tt) E.tarifsTTC=tt.value==="ttc";
  const te=parseFloat(document.getElementById("glob-tarif-elec").value);
  const tw=parseFloat(document.getElementById("glob-tarif-eau").value);
  if(!isNaN(te)&&te>0) S().tarifElec=te;
  if(!isNaN(tw)&&tw>0) S().tarifEau=tw;
  await sauvegarder();
  alert("✅ Sauvegardé !");
  renderLocataires();
};

// ════════════════════════════════════════════════════════════
//  BOARD
// ════════════════════════════════════════════════════════════
function renderBoard(){
  let h="";
  const lElec=LE(), lEau=LW();

  // ── ÉLEC ──
  h+=`<div class="sec-title">⚡ Électricité</div>`;
  const allElecDiffs={};
  lElec.forEach(l=>{ allElecDiffs[l.id]=calcElecDiffs(l.id); });
  const hasElec=lElec.some(l=>allElecDiffs[l.id].length>0);

  if(!hasElec){ h+=`<div class="abox warn">Aucun relevé électricité.</div>`; }
  else{
    // Stats globales
    let totD=0,totP=0,lastDate="";
    lElec.forEach(l=>{
      const d=allElecDiffs[l.id];
      if(!d.length) return;
      const last=d[d.length-1];
      totD+=last.diff; totP+=last.prix;
      if(!lastDate||last.date>lastDate) lastDate=last.date;
    });
    h+=`<div class="sgrid">
      <div class="stat"><div class="slbl">Dernier relevé</div><div class="sval" style="font-size:15px">${lastDate}</div></div>
      <div class="stat"><div class="slbl">Conso totale</div><div class="sval">${totD.toFixed(0)}<span style="font-size:12px;font-weight:400"> kWh</span></div></div>
      <div class="stat"><div class="slbl">Coût total</div><div class="sval">${totP.toFixed(0)}<span style="font-size:12px;font-weight:400"> €</span></div></div>
      <div class="stat"><div class="slbl">⚡ Tarif kWh</div>
        <div style="display:flex;align-items:center;gap:5px;margin-top:3px">
          <input id="db-tarif-elec" type="number" step="0.001" value="${S().tarifElec}" style="width:65px;background:var(--surf2);border:.5px solid var(--border2);border-radius:var(--rsm);padding:4px 6px;font-size:15px;font-weight:600;color:var(--text);font-family:inherit;outline:none"/>
          <span style="font-size:11px;color:var(--text2)">€</span>
          <button onclick="appliquerTarifElec()" style="padding:4px 8px;background:var(--blue);color:#fff;border:none;border-radius:var(--rsm);font-size:11px;cursor:pointer">OK</button>
        </div>
      </div>
    </div>`;

    const maxD=Math.max(...lElec.map(l=>{ const d=allElecDiffs[l.id]; return d.length?d[d.length-1].diff:0; }));
    h+=`<div class="card"><div class="ctitle">Consommation par locataire</div>`;
    lElec.forEach(l=>{
      const d=allElecDiffs[l.id]; if(!d.length) return;
      const last=d[d.length-1];
      h+=`<div class="bar-row">
        <span class="bar-lbl"><span class="loc-color" style="background:${l.couleur}"></span>${l.nom.split(' ')[0]}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${maxD>0?(last.diff/maxD*100).toFixed(0):0}%;background:${l.couleur}"></div></div>
        <span class="bar-val">${last.diff.toFixed(0)} kWh</span>
        <span class="badge ${badgeKwh(last.diff)}">${last.prix.toFixed(0)} €</span>
      </div>`;
    });
    h+=`</div><div class="bgrid">`;
    lElec.forEach(l=>{
      const d=allElecDiffs[l.id]; if(!d.length) return;
      const last=d[d.length-1],bal=+(last.forf-last.prix).toFixed(2);
      h+=`<div class="bcard">
        <div class="bcard-name" style="color:${l.couleur}">${l.nom}</div>
        <div class="bcard-row"><span style="font-size:10px;color:var(--text3)">${l.appart}</span></div>
        <div class="bcard-row"><span>Forfait</span><span>${last.forf} €</span></div>
        <div class="bcard-row"><span>Consommé</span><span>${last.prix.toFixed(2)} €</span></div>
        <div class="bcard-tot" style="color:${colorBal(bal)}">${fmtBal(bal)} €</div>
      </div>`;
    });
    h+=`</div>`;
    getAlertes('elec').forEach(a=>h+=`<div class="abox ${a.l}">⚠️ ${a.m}</div>`);
  }

  // ── EAU ──
  h+=`<div class="sec-title" style="margin-top:1.5rem">💧 Eau</div>`;
  if(!lEau.length){ h+=`<div class="abox warn">Aucun locataire eau actif.</div>`; }
  else{
    let anyEau=false;
    h+=`<div class="bgrid">`;
    lEau.forEach(l=>{
      const d=calcEauDiffs(l.id); if(!d.length) return;
      anyEau=true;
      const last=d[d.length-1],bal=+(last.forf-last.prix).toFixed(2);
      h+=`<div class="bcard">
        <div class="bcard-name" style="color:var(--teal)">${l.nom}</div>
        <div class="bcard-row"><span style="font-size:10px;color:var(--text3)">${l.appart}</span></div>
        <div class="bcard-row"><span>Forfait</span><span>${last.forf} €</span></div>
        <div class="bcard-row"><span>${last.diff.toFixed(2)} m³</span><span>${last.prix.toFixed(2)} €</span></div>
        ${last.general?`<div class="bcard-row"><span style="font-size:10px;color:var(--text3)">Général ${last.brut.toFixed(2)} − appts ${last.deduit.toFixed(2)}</span></div>`:''}
        ${last.manquants&&last.manquants.length?`<div class="bcard-row"><span style="font-size:10px;color:var(--err)">⚠️ Incomplet : relevé manquant ${last.manquants.join(', ')}</span></div>`:''}
        <div class="bcard-tot" style="color:${colorBal(bal)}">${fmtBal(bal)} €</div>
      </div>`;
    });
    h+=`</div>`;
    if(!anyEau) h+=`<p style="color:var(--text2);font-size:13px">Pas encore de relevés eau.</p>`;
    getAlertes('eau').forEach(a=>h+=`<div class="abox ${a.l}">⚠️ ${a.m}</div>`);
  }

  document.getElementById("pane-board").innerHTML=h;
}

window.appliquerTarifElec=async function(){
  const v=parseFloat(document.getElementById("db-tarif-elec").value);
  if(isNaN(v)||v<=0){alert("Tarif invalide.");return;}
  S().tarifElec=v; await sauvegarder(); renderBoard();
};

// ════════════════════════════════════════════════════════════
//  ALERTES
// ════════════════════════════════════════════════════════════
function getAlertes(type){
  const al=[];
  const locs=type==='elec'?LE():LW();
  locs.forEach(loc=>{
    const diffs=type==='elec'?calcElecDiffs(loc.id):calcEauDiffs(loc.id);
    const years=getYearsFrom(diffs.map(d=>({date:d.date})));
    years.forEach(y=>{
      const an=diffs.filter(d=>getYear(d.date)===y);
      const rest=12-an.length; if(rest<=0) return;
      const tot=an.reduce((s,d)=>s+d.diff,0);
      const moy=an.length>0?tot/an.length:0;
      const tarif=type==='elec'?TE(loc):TW(loc);
      const projPrix=+((tot+moy*rest)*tarif+(type==='elec'?ABO(loc)*(an.length+rest):0)).toFixed(2);
      const lastForf=an[an.length-1].forf;
      const forfT=an.reduce((s,d)=>s+d.forf,0);
      const projForf=+(forfT+lastForf*rest).toFixed(0);
      const pb=+(projForf-projPrix).toFixed(2);
      const seuil=type==='elec'?-30:-10;
      const icon=type==='elec'?"⚡":"💧";
      if(pb<seuil) al.push({l:"err",m:`${icon} ${loc.nom} (${y}) : ~${Math.abs(pb).toFixed(0)} € de dépassement estimé.`});
    });
  });
  return al;
}

function renderElec(){
  document.getElementById("pane-elec").innerHTML=`
    <div class="subtabs">
      <button class="subtab ${elecSub==='releves'?'active':''}" onclick="elecSub='releves';renderElec()">📋 Relevés</button>
      <button class="subtab ${elecSub==='annuel'?'active':''}" onclick="elecSub='annuel';renderElec()">📅 Synthèse annuelle</button>
      <button class="subtab ${elecSub==='ajouter'?'active':''}" onclick="elecSub='ajouter';renderElec()">➕ Ajouter</button>
    </div><div id="elec-inner"></div>`;
  if(elecSub==='releves')     renderElecReleves();
  else if(elecSub==='annuel') renderElecAnnuel();
  else                        renderElecAjouter();
}

function renderElecReleves(){
  const locs=LE(); let h="";
  locs.forEach(loc=>{
    const diffs=calcElecDiffs(loc.id);
    const tot=diffs.reduce((s,d)=>s+d.diff,0);
    const totP=+(tot*TE(loc)+ABO(loc)*diffs.length).toFixed(2);
    h+=`<div class="card"><div class="ctitle" style="color:${loc.couleur}">
      <span class="loc-color" style="background:${loc.couleur}"></span>${loc.nom}
      <span style="font-size:12px;font-weight:400;color:var(--text2)"> — ${loc.appart} · ${TE(loc)} €/kWh${ABO(loc)?' + abonnement '+ABO(loc)+' €/mois':''}</span></div>`;
    if(!diffs.length){ h+=`<p style="color:var(--text3);font-size:12px;font-style:italic">Aucun relevé.</p>`; }
    else{
      h+=`<table><thead><tr><th>Mois</th><th>Relevé kWh</th><th>kWh</th><th>Coût €</th><th>Forfait €</th><th>Balance</th><th>📷</th><th></th></tr></thead><tbody>`;
      diffs.forEach(d=>{
        const b=+(d.forf-d.prix).toFixed(2);
        const photos=d.photos||[];
        h+=`<tr>
          <td>${dateLabel(d.date)}</td>
          <td><input type="number" value="${d.releve}" step="0.01" style="width:85px;background:var(--surf2);border:.5px solid var(--border2);border-radius:4px;padding:3px 5px;font-size:12px;color:var(--text);font-family:inherit;outline:none" onchange="modifElecReleve('${loc.id}','${d.date}',this.value)"/></td>
          <td><span class="badge ${badgeKwh(d.diff)}">${d.diff.toFixed(0)}</span></td>
          <td>${d.prix.toFixed(2)}</td><td>${d.forf}</td>
          <td style="color:${colorBal(b)}">${fmtBal(b)}</td>
          <td style="text-align:left">
            ${(d.photos||[]).map((p,i)=>`<div style="display:flex;gap:3px;align-items:center;margin-bottom:2px">
              <a href="${p}" target="_blank" style="font-size:11px;color:var(--blue)">📷 ${i+1}</a>
              <button onclick="delElecPhoto('${d.date}',${i})" style="padding:1px 4px;background:none;border:none;color:var(--err);cursor:pointer;font-size:10px">✕</button>
            </div>`).join('')}
            <div style="display:flex;gap:3px;margin-top:2px">
              <input type="text" id="ephoto-${d.date.replace(/\//g,'-')}" placeholder="+ Lien Drive" style="width:75px;font-size:10px;background:var(--surf2);border:.5px solid var(--border2);border-radius:4px;padding:2px 4px;color:var(--text);font-family:inherit;outline:none"/>
              <button onclick="setElecPhoto('${d.date}')" style="padding:2px 5px;background:var(--blue);color:#fff;border:none;border-radius:4px;font-size:10px;cursor:pointer">+</button>
            </div>
          </td>
          <td style="white-space:nowrap">${aFacture(loc)?`<button onclick="factureCharges('${loc.id}','${d.date}')" title="Facture de charges" style="padding:3px 7px;background:var(--blue);color:#fff;border:none;border-radius:4px;font-size:11px;cursor:pointer;margin-right:4px">🧾 Facture</button>`:''}<button class="btn-del" onclick="supprimerElecReleveDate('${loc.id}','${d.date}')">🗑</button></td>
        </tr>`;
      });
      h+=`<tr class="tot"><td colspan="2">Total (${diffs.length} mois)</td><td>${tot.toFixed(0)}</td><td>${totP.toFixed(2)}</td><td colspan="4"></td></tr>`;
      h+=`</tbody></table>`;
    }
    h+=`</div>`;
  });
  document.getElementById("elec-inner").innerHTML=h||`<div class="abox warn">Aucun locataire électricité actif.</div>`;
}

function renderElecAnnuel(){
  const locs=LE();
  const allRels=S().elec.releves;
  const years=getYearsFrom(allRels);
  if(!years.length){document.getElementById("elec-inner").innerHTML=`<div class="abox warn">Pas encore de relevés.</div>`;return;}
  if(!elecYear||!years.includes(elecYear)) elecYear=years[years.length-1];
  let h=`<div style="display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap">`;
  years.forEach(y=>h+=`<button class="ybtn ${y===elecYear?"active":""}" onclick="elecYear='${y}';renderElec()">${y}</button>`);
  h+=`</div>`;
  locs.forEach(loc=>{
    const diffs=calcElecDiffs(loc.id);
    const annee=diffs.filter(d=>getYear(d.date)===elecYear);
    const rest=12-annee.length;
    const total=annee.reduce((s,d)=>s+d.diff,0);
    const totalP=+(total*TE(loc)+ABO(loc)*annee.length).toFixed(2);
    const forfT=annee.reduce((s,d)=>s+d.forf,0);
    const bal=+(forfT-totalP).toFixed(2);
    const moy=annee.length>0?total/annee.length:0;
    const pKwh=+(total+moy*rest).toFixed(0);
    const pP=+(pKwh*TE(loc)+ABO(loc)*(annee.length+rest)).toFixed(2);
    const lastForf=annee.length>0?annee[annee.length-1].forf:0;
    const pForf=+(forfT+lastForf*rest).toFixed(0);
    const pBal=+(pForf-pP).toFixed(2);
    const lastM=annee.length>0?+annee[annee.length-1].date.split("/")[1]:0;
    h+=`<div class="card"><div class="ctitle" style="color:${loc.couleur}">
      <span class="loc-color" style="background:${loc.couleur}"></span>${loc.nom}
      <span style="font-size:12px;font-weight:400;color:var(--text2)"> — ${loc.appart}</span></div>`;
    if(!annee.length){ h+=`<p style="color:var(--text3);font-size:12px;font-style:italic">Aucun relevé pour ${elecYear}.</p>`; }
    else{
      // Données N-1 pour projection saisonnière
      const prevYear=String(+elecYear-1);
      const prevDiffs=diffs.filter(d=>getYear(d.date)===prevYear);
      // Index par numéro de mois (1-12)
      const prevByMonth={};
      prevDiffs.forEach(d=>{ prevByMonth[+d.date.split("/")[1]]=d.diff; });
      const hasPrevData=prevDiffs.length>0;

      // Recalcul projection saisonnière
      let projKwhSaison=total, projForfSaison=forfT;
      const projMois=[];
      for(let i=1;i<=rest;i++){
        const mNum=(lastM+i-1)%12+1; // numéro mois 1-12
        const mi=mNum-1;              // index MOIS 0-11
        const kwh=hasPrevData&&prevByMonth[mNum]!=null ? prevByMonth[mNum] : moy;
        const pp=+(kwh*TE(loc)+ABO(loc)).toFixed(2);
        const pb=+(lastForf-pp).toFixed(2);
        const source=hasPrevData&&prevByMonth[mNum]!=null?"N-1":"moy";
        projKwhSaison+=kwh;
        projForfSaison+=lastForf;
        projMois.push({mi,mNum,kwh,pp,pb,source});
      }
      const pPSaison=+(projKwhSaison*TE(loc)+ABO(loc)*(annee.length+rest)).toFixed(2);
      const pBalSaison=+(projForfSaison-pPSaison).toFixed(2);

      if(rest>0&&pBalSaison<0)       h+=`<div class="abox err">⚠️ Dépassement estimé : <strong>${Math.abs(pBalSaison).toFixed(0)} €</strong> pour ${elecYear}.</div>`;
      else if(rest>0&&pBalSaison<50) h+=`<div class="abox warn">Marge faible : ~${pBalSaison.toFixed(0)} € d'excédent estimé.</div>`;

      h+=`<table><thead><tr><th>Mois</th><th>Relevé</th><th>kWh</th><th>Coût €</th><th>Forfait €</th><th>Balance</th><th>✅ Payé</th></tr></thead><tbody>`;
      annee.forEach(d=>{
        const b=+(d.forf-d.prix).toFixed(2);
        const paye=getElecPaye(loc.id,d.date);
        h+=`<tr style="opacity:${paye?'.6':'1'}">
          <td>${dateLabel(d.date)}</td><td>${d.releve.toFixed(1)}</td>
          <td><span class="badge ${badgeKwh(d.diff)}">${d.diff.toFixed(0)}</span></td>
          <td>${d.prix.toFixed(2)}</td><td>${d.forf}</td>
          <td style="color:${colorBal(b)}">${fmtBal(b)}</td>
          <td style="text-align:center">
            <label style="cursor:pointer;font-size:16px" title="${paye?'Payé':'Non payé'}">
              <input type="checkbox" ${paye?'checked':''} onchange="toggleElecPaye('${loc.id}','${d.date}',this.checked)" style="display:none"/>
              ${paye?'✅':'⬜'}
            </label>
          </td>
        </tr>`;
      });
      projMois.forEach(p=>{
        h+=`<tr class="proj${p.pb<0?" alerte":""}">
          <td>${MOIS[p.mi]} ${elecYear} <span style="font-size:10px;color:var(--text3)">${p.source==='N-1'?'('+prevYear+')':'(moy)'}</span></td>
          <td>—</td>
          <td>${p.kwh.toFixed(0)}</td>
          <td>${p.pp.toFixed(2)}</td>
          <td>${lastForf}</td>
          <td style="color:${colorBal(p.pb)}">${fmtBal(p.pb)}</td>
          <td>—</td></tr>`;
      });
      // Total N-1 sur la même période (même nombre de mois)
      const prevTotalKwh=annee.reduce((s,d)=>{
        const mNum=+d.date.split("/")[1];
        return s+(prevByMonth[mNum]!=null?prevByMonth[mNum]:0);
      },0);
      const prevTotalP=+(prevTotalKwh*TE(loc)+ABO(loc)*annee.length).toFixed(2);
      const hasPrevTotal=prevDiffs.length>0;
      const diffPct=hasPrevTotal&&prevTotalKwh>0?+(((total-prevTotalKwh)/prevTotalKwh)*100).toFixed(1):null;

      const moisPayes=annee.filter(d=>getElecPaye(loc.id,d.date)).length;
      h+=`<tr class="tot">
        <td>Total réel (${annee.length} mois) <span style="font-size:10px;color:${moisPayes===annee.length?'var(--ok)':'var(--warn)'}">✅ ${moisPayes}/${annee.length} payés</span></td><td>—</td>
        <td>${total.toFixed(0)} kWh
          ${hasPrevTotal?`<span style="font-size:10px;color:var(--text3);display:block">${prevYear} : ${prevTotalKwh.toFixed(0)} kWh
            <span style="color:${diffPct!=null?(diffPct>0?'var(--err)':'var(--ok)'):'var(--text3)'}">
              ${diffPct!=null?(diffPct>0?'▲':'▼')+Math.abs(diffPct)+'%':''}
            </span>
          </span>`:''}
        </td>
        <td>${totalP.toFixed(2)} €
          ${hasPrevTotal?`<span style="font-size:10px;color:var(--text3);display:block">${prevYear} : ${prevTotalP.toFixed(2)} €</span>`:''}
        </td>
        <td>${forfT.toFixed(0)}</td>
        <td style="color:${colorBal(bal)}">${fmtBal(bal)}</td>
      </tr>`;
      if(rest>0) h+=`<tr class="tot" style="opacity:.7"><td>Projection année</td><td>—</td><td>${projKwhSaison.toFixed(0)}</td><td>${pPSaison.toFixed(2)}</td><td>${projForfSaison.toFixed(0)}</td>
        <td style="color:${colorBal(pBalSaison)}">${fmtBal(pBalSaison)}</td></tr>`;
      h+=`</tbody></table><p style="font-size:11px;color:var(--text3);margin-top:8px">✦ Projection saisonnière basée sur ${prevYear} · (moy) = fallback si pas de données N-1</p>`;
    }
    h+=`</div>`;
  });
  document.getElementById("elec-inner").innerHTML=h;
}

function renderElecAjouter(){
  const locs=LE();
  const sorted=[...S().elec.releves].sort(sortByDate);
  const last=sorted.length?sorted[sorted.length-1]:null;
  let h=`<div class="card"><div class="ctitle">➕ Nouveau relevé électricité</div>
    <div class="fgrid"><div class="fg"><label>Date du relevé</label><input type="date" id="ef-date"/></div></div>
    <div class="fgrid" style="margin-top:8px">`;
  locs.forEach(loc=>{
    h+=`<div class="fg"><label style="color:${loc.couleur}">${loc.nom} <span style="font-weight:400;color:var(--text3)">— dernier : ${last&&last[loc.id]!=null?last[loc.id]:""}</span></label>

function renderEauAnnuel(){
  const locs=LW();
  const years=new Set();
  locs.forEach(l=>calcEauDiffs(l.id).forEach(d=>years.add(getYear(d.date))));
  const yrs=[...years].sort();
  if(!yrs.length){document.getElementById("eau-inner").innerHTML=`<div class="abox warn">Pas encore assez de relevés.</div>`;return;}
  if(!eauYear||!yrs.includes(eauYear)) eauYear=yrs[yrs.length-1];
  let h=`<div style="display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap">`;
  yrs.forEach(y=>h+=`<button class="ybtn ${y===eauYear?"active":""}" onclick="eauYear='${y}';renderEau()">${y}</button>`);
  h+=`</div>`;
  locs.forEach(loc=>{
    const diffs=calcEauDiffs(loc.id);
    const annee=diffs.filter(d=>getYear(d.date)===eauYear);
    const rest=12-annee.length;
    const total=annee.reduce((s,d)=>s+d.diff,0);
    const totalP=+(total*TW(loc)).toFixed(2);
    const forfT=annee.reduce((s,d)=>s+d.forf,0);
    const bal=+(forfT-totalP).toFixed(2);
    const moy=annee.length>0?total/annee.length:0;
    const pM3=+(total+moy*rest).toFixed(2);
    const pP=+(pM3*TW(loc)).toFixed(2);
    const lastForf=annee.length>0?annee[annee.length-1].forf:0;
    const pForf=+(forfT+lastForf*rest).toFixed(0);
    const pBal=+(pForf-pP).toFixed(2);
    const lastM=annee.length>0?+annee[annee.length-1].date.split("/")[1]:0;
    h+=`<div class="card"><div class="ctitle" style="color:var(--teal)">💧 ${loc.nom}
      <span style="font-size:12px;font-weight:400;color:var(--text2)"> — ${loc.appart}</span></div>`;
    if(!annee.length){ h+=`<p style="color:var(--text3);font-size:12px;font-style:italic">Aucun relevé pour ${eauYear}.</p>`; }
    else{
      // Projection saisonnière N-1
      const prevYearW=String(+eauYear-1);
      const prevDiffsW=calcEauDiffs(loc.id).filter(d=>getYear(d.date)===prevYearW);
      const prevByMonthW={};
      prevDiffsW.forEach(d=>{ prevByMonthW[+d.date.split("/")[1]]=d.diff; });
      const hasPrevW=prevDiffsW.length>0;

      let projM3Saison=total, projForfSaisonW=forfT;
      const projMoisW=[];
      for(let i=1;i<=rest;i++){
        const mNum=(lastM+i-1)%12+1;
        const mi=mNum-1;
        const m3=hasPrevW&&prevByMonthW[mNum]!=null ? prevByMonthW[mNum] : moy;
        const pp=+(m3*TW(loc)).toFixed(2);
        const pb=+(lastForf-pp).toFixed(2);
        const source=hasPrevW&&prevByMonthW[mNum]!=null?"N-1":"moy";
        projM3Saison+=m3;
        projForfSaisonW+=lastForf;
        projMoisW.push({mi,mNum,m3,pp,pb,source});
      }
      const pPSaisonW=+(projM3Saison*TW(loc)).toFixed(2);
      const pBalSaisonW=+(projForfSaisonW-pPSaisonW).toFixed(2);

      if(rest>0&&pBalSaisonW<0)       h+=`<div class="abox err">⚠️ Dépassement estimé : <strong>${Math.abs(pBalSaisonW).toFixed(0)} €</strong> pour ${eauYear}.</div>`;
      else if(rest>0&&pBalSaisonW<10) h+=`<div class="abox warn">Marge faible : ~${pBalSaisonW.toFixed(0)} € d'excédent estimé.</div>`;

      h+=`<table><thead><tr><th>Mois</th><th>Relevé m³</th><th>Conso m³</th><th>Coût €</th><th>Forfait €</th><th>Balance</th></tr></thead><tbody>`;
      annee.forEach(d=>{
        const b=+(d.forf-d.prix).toFixed(2);
        h+=`<tr><td>${dateLabel(d.date)}</td><td>${d.releve.toFixed(2)}</td>
          <td><span class="badge ${badgeM3(d.diff)}">${d.diff.toFixed(2)}</span></td>
          <td>${d.prix.toFixed(2)}</td><td>${d.forf}</td>
          <td style="color:${colorBal(b)}">${fmtBal(b)}</td></tr>`;
      });
      projMoisW.forEach(p=>{
        h+=`<tr class="proj${p.pb<0?" alerte":""}">
          <td>${MOIS[p.mi]} ${eauYear} <span style="font-size:10px;color:var(--text3)">${p.source==='N-1'?'('+prevYearW+')':'(moy)'}</span></td>
          <td>—</td>
          <td>${p.m3.toFixed(2)}</td>
          <td>${p.pp.toFixed(2)}</td>
          <td>${lastForf}</td>
          <td style="color:${colorBal(p.pb)}">${fmtBal(p.pb)}</td></tr>`;
      });
      // Total N-1 même période eau
      const prevTotalM3=annee.reduce((s,d)=>{
        const mNum=+d.date.split("/")[1];
        return s+(prevByMonthW[mNum]!=null?prevByMonthW[mNum]:0);
      },0);
      const prevTotalPW=+(prevTotalM3*TW(loc)).toFixed(2);
      const diffPctW=hasPrevW&&prevTotalM3>0?+(((total-prevTotalM3)/prevTotalM3)*100).toFixed(1):null;

      h+=`<tr class="tot">
        <td>Total réel (${annee.length} mois)</td><td>—</td>
        <td>${total.toFixed(2)} m³
          ${hasPrevW?`<span style="font-size:10px;color:var(--text3);display:block">${prevYearW} : ${prevTotalM3.toFixed(2)} m³
            <span style="color:${diffPctW!=null?(diffPctW>0?'var(--err)':'var(--ok)'):'var(--text3)'}">
              ${diffPctW!=null?(diffPctW>0?'▲':'▼')+Math.abs(diffPctW)+'%':''}
            </span>
          </span>`:''}
        </td>
        <td>${totalP.toFixed(2)} €
          ${hasPrevW?`<span style="font-size:10px;color:var(--text3);display:block">${prevYearW} : ${prevTotalPW.toFixed(2)} €</span>`:''}
        </td>
        <td>${forfT.toFixed(0)}</td>
        <td style="color:${colorBal(bal)}">${fmtBal(bal)}</td>
      </tr>`;
      if(rest>0) h+=`<tr class="tot" style="opacity:.7"><td>Projection année</td><td>—</td><td>${projM3Saison.toFixed(2)} m³</td><td>${pPSaisonW.toFixed(2)}</td><td>${projForfSaisonW.toFixed(0)}</td>
        <td style="color:${colorBal(pBalSaisonW)}">${fmtBal(pBalSaisonW)}</td></tr>`;
      h+=`</tbody></table><p style="font-size:11px;color:var(--text3);margin-top:8px">✦ Projection saisonnière basée sur ${prevYearW} · (moy) = fallback si pas de données N-1</p>`;
    }
    h+=`</div>`;
  });
  document.getElementById("eau-inner").innerHTML=h;
}

const eur=n=>n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/\u202f|\u00a0/g,' ')+' €';
// ── Rangement automatique dans le dossier TVA (PC : Chrome, Edge, Opera) ──
// L'utilisateur choisit UNE fois le dossier parent Téléchargements\Gestion locative (partagé avec l'appli Gestion locative).
// Ensuite chaque facture va dans le sous-dossier « TVA SCI THOMARION <MOIS> <ANNÉE> ».
const MOIS_LONG=["JANVIER","FÉVRIER","MARS","AVRIL","MAI","JUIN","JUILLET","AOÛT","SEPTEMBRE","OCTOBRE","NOVEMBRE","DÉCEMBRE"];
const idb=(mode,fn)=>new Promise((res,rej)=>{const o=indexedDB.open("jeancamp_fs",1);o.onupgradeneeded=()=>o.result.createObjectStore("h");o.onsuccess=()=>{const tx=o.result.transaction("h",mode);const r=fn(tx.objectStore("h"));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);};o.onerror=()=>rej(o.error);});
// Retourne le dossier mémorisé (autorisation redemandée si besoin), "choisir" s'il faut en choisir un, null si non compatible.
async function dossierTVA(){
  if(!window.showDirectoryPicker) return null;             // iPhone / navigateur non compatible → téléchargement normal
  try{
    let h=await idb("readonly",st=>st.get("dossier_gestion_locative"));
    if(!h){ // reprise d'un dossier choisi avant le 24/10/2026 18:12 (ancien réglage), s'il s'appelle « Gestion locative »
      const old=await idb("readonly",st=>st.get("tva"));
      if(old&&/gestion\s*locative/i.test(old.name)){ h=old; await idb("readwrite",st=>st.put(old,"dossier_gestion_locative")); }
    }
    if(!h) return "choisir";
    let perm=await h.queryPermission({mode:"readwrite"});
    if(perm!=="granted") perm=await h.requestPermission({mode:"readwrite"});
    return perm==="granted"?h:"choisir";
  }catch(e){ console.warn(e); return "choisir"; }
}
// Ouvre le sélecteur : à appeler DIRECTEMENT depuis un clic (sinon le navigateur bloque la fenêtre)
async function choisirDossierTVA(){
  try{
    const h=await window.showDirectoryPicker({id:"tva-sci",mode:"readwrite",startIn:"downloads"});
    await idb("readwrite",st=>st.put(h,"dossier_gestion_locative"));
    return h;
  }catch(e){
    console.warn("Dossier TVA non choisi",e);
    if(e&&e.name!=="AbortError") alert("Ce dossier ne peut pas être choisi ("+e.message+").\nAstuce : la racine de Téléchargements est interdite par le navigateur, choisissez le dossier « Gestion locative » à l'intérieur.");
    return null;
  }
}

      <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
        <button id="dtva-dl" class="btn btn-s">Télécharger sans ranger</button>
        <button id="dtva-ok" class="btn btn-p">📁 Choisir le dossier</button>
      </div></div>`;
    document.body.appendChild(ov);
    ov.querySelector("#dtva-ok").onclick=async()=>{ const h=await choisirDossierTVA(); ov.remove(); res(h); };

async function rangerPDF(dir,blob,nomFichier,dateFacture){
  const [,m,a]=dateFacture.split("/");
  const nomDossier=`${(S().emetteur.dossierTVA||"TVA SCI THOMARION")} ${MOIS_LONG[+m-1]} ${a}`;
  const sous=await dir.getDirectoryHandle(nomDossier,{create:true});
  const fh=await sous.getFileHandle(nomFichier,{create:true});
  const w=await fh.createWritable(); await w.write(blob); await w.close();
  return `${dir.name}\\${nomDossier}`;
}

window.factureCharges=async function(locId,date){
  const loc=S().locataires.find(l=>l.id===locId); if(!loc||!loc.facture) return;
  let dirTVA=await dossierTVA();          // demandé tout de suite (le navigateur exige que ce soit juste après le clic)
  if(dirTVA==="choisir") dirTVA=await demanderDossierTVA();
  const f=loc.facture, E=S().emetteur;
  if(!f.raison){alert("Renseignez la raison sociale du locataire dans 👤 Locataires.");return;}
  const de=(loc.elec&&loc.elec.actif)?calcElecDiffs(locId).find(d=>d.date===date):null;
  const dw=(loc.eau&&loc.eau.actif)?calcEauDiffs(locId).find(d=>d.date===date):null;
  if(!de&&!dw){alert("Aucune consommation à cette date.");return;}
  if(loc.elec&&loc.elec.actif&&loc.eau&&loc.eau.actif&&!dw){
    if(!confirm("Pas de relevé d'eau au "+date+" : la facture ne contiendra que l'électricité. Continuer ?")) return;
  }
  if(dw&&dw.manquants&&dw.manquants.length){
    if(!confirm("Eau incomplète (relevé manquant : "+dw.manquants.join(', ')+"). Continuer quand même ?")) return;
  }
  // Période : du relevé précédent à ce relevé
  const src=de?S().elec.releves.filter(r=>r[locId]!=null):S().eau.releves.filter(r=>r[locId]!=null);
  const triees=[...src].sort(sortByDate); const idx=triees.findIndex(r=>r.date===date);
  const debut=idx>0?triees[idx-1].date:date;
  const cout=+(((de?de.prix:0)+(dw?dw.prix:0))).toFixed(2);
  const taux=+E.tauxTva||0;
  let ht,tva,ttc;
  if(E.tarifsTTC){ ttc=cout; ht=+(ttc/(1+taux/100)).toFixed(2); tva=+(ttc-ht).toFixed(2); }
  else { ht=cout; tva=+(ht*taux/100).toFixed(2); ttc=+(ht+tva).toFixed(2); }
  // Numéro (réutilisé si déjà émis pour ce locataire et cette date)
  const [jj,mm,aa]=date.split("/");
  let fc=S().facturesCharges.find(x=>x.locId===locId&&x.date===date);
  if(!fc){
    // Numéro CH-AAAA-MM-001 : année et mois de la date de facture, compteur remis à 001 chaque mois
    const now=new Date(), fa=now.getFullYear(), fm=String(now.getMonth()+1).padStart(2,"0");
    const pref=`CH-${fa}-${fm}-`;
    const n=S().facturesCharges.filter(x=>x.num.startsWith(pref)).length+1;
    fc={num:`${pref}${String(n).padStart(3,"0")}`,locId,date,emise:now.toLocaleDateString('fr-FR')};
    S().facturesCharges.push(fc);
  }
  Object.assign(fc,{ht,tva,ttc,debut});
  await sauvegarder();

  const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:"mm",format:"a4"});
  const W=210, ml=18, mr=18; let y=20;
  pdf.setFont("helvetica","bold"); pdf.setFontSize(16); pdf.text(E.nom.toUpperCase(),ml,y);
  pdf.text("FACTURE",W-mr,y,{align:"right"});
  pdf.setFont("helvetica","normal"); pdf.setFontSize(9.5); y+=7;
  [E.adr1,E.adr2,"SIRET "+E.siret,"N° TVA : "+E.tva,E.tel+(E.email?" · "+E.email:"")].forEach(t=>{pdf.text(t,ml,y);y+=4.8;});
  let yr=27; pdf.setFont("helvetica","bold"); pdf.text("N° "+fc.num,W-mr,yr,{align:"right"}); pdf.setFont("helvetica","normal");
  yr+=4.8; pdf.text("Date : "+fc.emise,W-mr,yr,{align:"right"});
  yr+=4.8; pdf.text(`Période : du ${debut} au ${date}`,W-mr,yr,{align:"right"});
  // Client
  y=Math.max(y,yr)+10; const bx=112;
  pdf.setDrawColor(200); pdf.setFillColor(240,240,245); pdf.rect(bx,y,W-mr-bx,7,"F"); pdf.rect(bx,y,W-mr-bx,33);
  pdf.setFont("helvetica","bold"); pdf.setFontSize(8.5); pdf.text("FACTURÉ À",bx+3,y+4.8);
  pdf.setFontSize(10); pdf.text(f.raison,bx+3,y+12); pdf.setFont("helvetica","normal"); pdf.setFontSize(9.5);
  let yc=y+17; [f.adr1,f.adr2,f.siren,f.tva?"N° TVA : "+f.tva:""].filter(Boolean).forEach(t=>{pdf.text(t,bx+3,yc);yc+=4.6;});
  // Tableau
  y+=45; pdf.setFillColor(240,240,245); pdf.rect(ml,y,W-ml-mr,8,"F");
  pdf.setFont("helvetica","bold"); pdf.setFontSize(9.5);
  pdf.text("Désignation",ml+3,y+5.4); pdf.text("Qté",130,y+5.4,{align:"right"}); pdf.text("TVA",150,y+5.4,{align:"right"}); pdf.text("Total HT",W-mr-3,y+5.4,{align:"right"});
  y+=8; pdf.setFont("helvetica","normal");
  const des=pdf.splitTextToSize(`Refacturation de charges locatives — ${loc.appart}, 83 avenue Jean Camp, Narbonne — période du ${debut} au ${date}`,95);
  pdf.text(des,ml+3,y+6); pdf.text("1",130,y+6,{align:"right"}); pdf.text(taux+" %",150,y+6,{align:"right"}); pdf.text(eur(ht),W-mr-3,y+6,{align:"right"});
  y+=6+des.length*4.6+3; pdf.setDrawColor(200); pdf.line(ml,y,W-mr,y);
  // Totaux
  y+=8; const tx=150, tv=W-mr-3;
  [["Total HT",eur(ht)],[`TVA ${taux} %`,eur(tva)]].forEach(r=>{pdf.text(r[0],tx,y,{align:"right"});pdf.text(r[1],tv,y,{align:"right"});y+=6.5;});
  pdf.setFillColor(240,240,245); pdf.rect(112,y-4.6,W-mr-112,7.5,"F"); pdf.setFont("helvetica","bold");
  pdf.text("TOTAL TTC",tx,y,{align:"right"}); pdf.text(eur(ttc),tv,y,{align:"right"});
  // Conditions
  y+=16; pdf.setFont("helvetica","normal"); pdf.setFontSize(8.3);
  const cond=pdf.splitTextToSize("Charges refacturées au coût réel, sans marge, selon les relevés de compteurs de la période. Paiement à réception par virement ou tout moyen à votre convenance. Pas d'escompte pour paiement anticipé. En cas de retard de paiement, pénalités au taux de trois fois le taux d'intérêt légal (art. L.441-10 du Code de commerce) et indemnité forfaitaire pour frais de recouvrement de 40 € (art. D.441-5 du Code de commerce).",W-ml-mr);
  pdf.text(cond,ml,y);
  pdf.setDrawColor(0); pdf.line(ml,282,W-mr,282); pdf.setFontSize(7.5);
  pdf.text(`${E.nom} - ${E.adr1}, ${E.adr2} - SIRET ${E.siret} - TVA ${E.tva}`,W/2,286,{align:"center"});
  const nomFichier=`Facture_charges_${fc.num}_${f.raison.replace(/[^A-Za-z0-9]+/g,'_')}.pdf`;
  if(dirTVA){
    try{
      const ou=await rangerPDF(dirTVA,pdf.output("blob"),nomFichier,fc.emise);
      alert("✅ Facture "+fc.num+" rangée dans :\n"+ou);
      return;
    }catch(e){ console.error(e); alert("Rangement impossible ("+e.message+"). La facture est téléchargée normalement."); }
  }
  pdf.save(nomFichier);
};

// ════════════════════════════════════════════════════════════
//  MODIFICATION INLINE + PHOTOS
// ════════════════════════════════════════════════════════════
window.modifElecReleve=async function(locId,date,val){
  const r=S().elec.releves.find(r=>r.date===date);
  if(r){ r[locId]=parseFloat(val)||r[locId]; await sauvegarder(); renderElecReleves(); }
};

window.supprimerElecReleveDate=async function(locId,date){
  if(!confirm("Supprimer la valeur du "+date+" pour ce locataire ?")) return;
  const r=S().elec.releves.find(r=>r.date===date);
  if(r){ delete r[locId]; await sauvegarder(); renderElecReleves(); }
};

window.setElecPhoto=async function(date){
  const id="ephoto-"+date.replace(/\//g,'-');
  const el=document.getElementById(id);
  if(!el||!el.value.trim()){alert("Colle un lien Drive d'abord.");return;}
  const r=S().elec.releves.find(r=>r.date===date);
  if(r){
    if(!r.photos) r.photos=[];
    r.photos.push(el.value.trim());
    el.value='';
    await sauvegarder();
    renderElecReleves();
  }
};

window.delElecPhoto=async function(date,idx){
  const r=S().elec.releves.find(r=>r.date===date);
  if(r&&r.photos){ r.photos.splice(idx,1); await sauvegarder(); renderElecReleves(); }
};

window.setEauPhoto=async function(date){
  const id="wphoto-"+date.replace(/\//g,'-');
  const el=document.getElementById(id);
  if(!el||!el.value.trim()){alert("Colle un lien Drive d'abord.");return;}
  const r=S().eau.releves.find(r=>r.date===date);
  if(r){
    if(!r.photos) r.photos=[];
    r.photos.push(el.value.trim());
    el.value='';
    await sauvegarder();
    renderEauReleves();
  }
};

window.delEauPhoto=async function(date,idx){
  const r=S().eau.releves.find(r=>r.date===date);
  if(r&&r.photos){ r.photos.splice(idx,1); await sauvegarder(); renderEauReleves(); }
};

window.modifEauReleve=async function(locId,date,val){
  const r=S().eau.releves.find(r=>r.date===date);
  if(r){ r[locId]=parseFloat(val)||r[locId]; await sauvegarder(); renderEauReleves(); }
};

window.supprimerEauReleveDate=async function(locId,date){
  if(!confirm("Supprimer la valeur du "+date+" pour ce locataire ?")) return;
  const r=S().eau.releves.find(r=>r.date===date);
  if(r){ delete r[locId]; await sauvegarder(); renderEauReleves(); }
};

// ════════════════════════════════════════════════════════════
//  PAIEMENTS ÉLECTRICITÉ
// ════════════════════════════════════════════════════════════
function getElecPaye(locId,date){
  if(!S().paiementsElec) return false;
  return !!(S().paiementsElec[locId] && S().paiementsElec[locId][date]);
}

window.toggleElecPaye=async function(locId,date,val){
  if(!S().paiementsElec) S().paiementsElec={};
  if(!S().paiementsElec[locId]) S().paiementsElec[locId]={};
  if(val) S().paiementsElec[locId][date]=true;
  else delete S().paiementsElec[locId][date];
  await sauvegarder();
  renderElecAnnuel();
};
